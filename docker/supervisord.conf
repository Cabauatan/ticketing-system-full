[supervisord]
nodaemon=true
user=www-data
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -e stderr -g "daemon off;"
priority=20
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=/usr/local/bin/php artisan reverb:start --host=127.0.0.1 --port=8081 --no-interaction
directory=/var/www/html
user=www-data
priority=15
autostart=%(ENV_RUN_REVERB)s
autorestart=true
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/php artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
priority=30
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600 --memory=128 --no-interaction
directory=/var/www/html
user=www-data
priority=30
autostart=%(ENV_RUN_QUEUE_WORKER)s
autorestart=true
stopsignal=TERM
stopwaitsecs=95
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
